<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe6" />
    <title>Homeroom</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* First-paint background so the window never flashes white while the
         stylesheet loads. Mirrors --color-bg and its .dark override. */
      html {
        background-color: #f3efe6;
      }
      html.dark {
        background-color: #14110d;
      }
      body {
        margin: 0;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        padding: 0 1.5rem 10dvh;
        text-align: center;
        background-color: #f3efe6;
      }
      html.dark .boot {
        background-color: #14110d;
      }
      /* Splash entrance: the mark pops in, the wordmark rises after it,
         then the tagline. The drop sequence in app-shell.tsx holds the
         overlay long enough for all three to finish playing. */
      .boot-logo {
        width: 3.25rem;
        height: 3.25rem;
        margin-bottom: 0.6rem;
        opacity: 0;
        animation: boot-logo 0.5s cubic-bezier(0.34, 1.35, 0.5, 1) 0.04s both;
      }
      .boot-title {
        font-family: Fraunces, Georgia, serif;
        font-size: 1.75rem;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: #1a1714;
        margin: 0;
        opacity: 0;
        animation: boot-rise 0.5s cubic-bezier(0.21, 0.9, 0.35, 1) 0.14s both;
      }
      html.dark .boot-title {
        color: #ece4d3;
      }
      .boot-sub {
        font-family: Figtree, system-ui, sans-serif;
        font-size: 0.75rem;
        color: #6b645c;
        margin: 0;
        opacity: 0;
        animation: boot-rise 0.5s cubic-bezier(0.21, 0.9, 0.35, 1) 0.3s both;
      }
      html.dark .boot-sub {
        color: #ada191;
      }
      @keyframes boot-logo {
        from {
          opacity: 0;
          transform: scale(0.7);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes boot-rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo,
        .boot-title,
        .boot-sub {
          animation: none;
          opacity: 1;
        }
      }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      // The android class switches scrollbars off (see styles.css).
      try {
        if (/Android/i.test(navigator.userAgent)) {
          document.documentElement.classList.add("android");
        }
        var saved = JSON.parse(localStorage.getItem("homeroom-v1") || "{}");
        var theme =
          saved && saved.state && saved.state.settings
            ? saved.state.settings.theme
            : "system";
        if (
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div class="boot" id="boot" aria-hidden="true">
      <svg class="boot-logo" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <rect width="16" height="16" rx="3" fill="#2c3d38" />
        <rect x="4" y="3" width="9" height="10" rx="1" fill="#f3efe6" />
        <rect x="4" y="3" width="2" height="10" fill="#1a1714" />
        <rect x="8" y="6" width="4" height="2" fill="#2c3d38" />
        <rect x="8" y="10" width="3" height="2" fill="#2c3d38" />
      </svg>
      <p class="boot-title">Homeroom</p>
      <p class="boot-sub">Timetable · homework · exams · attendance</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
