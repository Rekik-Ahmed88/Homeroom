name: Release

# Manually executed: Actions → Release → Run workflow, then enter the tag
# (e.g. v0.1.0). Builds the Linux AppImage and both Android APKs, signs the
# release APK, and publishes everything as a GitHub Release.
#
# Required repository secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64  base64 of the release keystore:
#                              base64 -w0 ~/.keystores/homeroom-2026.keystore
#   KEYSTORE_PASSWORD        keystore password
#   KEY_ALIAS                key alias (e.g. homeroom)
#   KEY_PASSWORD             key password (often same as the keystore password)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      release_notes:
        description: "Release notes body. Leave empty to auto-generate (categorized)."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget \
            file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - run: npm ci
      - run: bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: |
            src-tauri/target/release/Homeroom_*_amd64.AppImage
            src-tauri/target/release/Homeroom_*_linux-x86_64.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Android NDK
        # Runner images ship cmdline-tools (not on PATH); setup-android is
        # intentionally NOT used — it requests the long-removed `tools`
        # package and fails. ANDROID_HOME is preset on the runner.
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"
      - run: npm ci
      - name: Init Android project
        # src-tauri/gen/ is gitignored, so fresh checkouts need scaffolding.
        # init alone is not enough: it leaves placeholder icons and no
        # CAMERA permission, so regenerate icons from icon.png and patch
        # the manifest (see scripts/patch-android-manifest.sh).
        run: |
          source scripts/android-env.sh
          npx tauri android init
          npx tauri icon src-tauri/icons/icon.png
          bash scripts/patch-android-manifest.sh
      - name: Restore release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
      - name: Build release APK
        run: npm run android:apk:release
      - name: Sign release APK
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out app-universal-release.apk \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          "$APKSIGNER" verify app-universal-release.apk
          rm -f /tmp/release.keystore
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: app-universal-release.apk

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Homeroom ${{ inputs.tag }}
          # Custom notes when provided (first release); otherwise GitHub
          # auto-generates categorized notes from PR labels (.github/release.yml).
          generate_release_notes: ${{ inputs.release_notes == '' }}
          body: ${{ inputs.release_notes }}
          files: |
            *.AppImage
            *.tar.gz
            *.apk
